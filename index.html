const TILE_SIZE=1.0;const assetRegistry={road:{basePath:"./models/SM_road_001a",cornerSE:"./models/SM_road_001b",useModel:true},kiosk:{basePath:"./models/SM_kiosk_001a",useModel:true}};const warehouseModels={isolated:"./models/SM_warehouse_001a",end:"./models/SM_warehouse_001c",center:"./models/SM_warehouse_001b"};const defaultColors={"parking lot":"#303030",road:"#7b4b2a",warehouse:"#2f8f46",dumpsters:"#1f78d1",kiosk:"#c62828"};const colorByType={...defaultColors};const modelCache={};let scene,camera,renderer,controls,tileGroup,selectedType=null;let pickables=[];const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();const gltfLoader=new GLTFLoader(),fbxLoader=new FBXLoader();const viewport=document.querySelector("#viewport"),statusEl=document.querySelector("#status"),tooltip=document.querySelector("#tooltip"),selectedTypeEl=document.querySelector("#selectedType"),colorPicker=document.querySelector("#colorPicker");document.querySelector("#sourceUrl").textContent=CSV_URL;document.querySelector("#assetVersionText").textContent=ASSET_VERSION;
function versioned(p){return`${p}?v=${encodeURIComponent(ASSET_VERSION)}`}function setStatus(m){statusEl.textContent=m}function parseCSV(text){const rows=[];let cur="",row=[],q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cur+='"';i++}else if(c==='"')q=!q;else if(c===","&&!q){row.push(cur.trim());cur=""}else if((c==="\n"||c==="\r")&&!q){if(cur||row.length){row.push(cur.trim());rows.push(row);row=[];cur=""}if(c==="\r"&&n==="\n")i++}else cur+=c}if(cur||row.length)rows.push([...row,cur.trim()]);if(!rows.length)return[];const headers=rows.shift().map(h=>h.toLowerCase().replace(/^"|"$/g,""));return rows.filter(r=>r.some(cell=>cell!=="")).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??"").replace(/^"|"$/g,"")]))) }function colorFor(label,color){const key=String(label||"").trim().toLowerCase();if(colorByType[key])return colorByType[key];return defaultColors[String(color||"").trim().toLowerCase()]||color||"#88c0d0"}function buildGrid(rows){const grid=new Map();for(const r of rows)grid.set(`${r.x},${r.y}`,r.label);return grid}function neighbors(grid,x,y,type){const dirs=[[0,-1,"N"],[1,0,"E"],[0,1,"S"],[-1,0,"W"]],hits=[];for(const[dx,dy,d]of dirs){if(grid.get(`${x+dx},${y+dy}`)===type)hits.push(d)}return hits}function countWarehouseNeighbors(grid,x,y){return neighbors(grid,x,y,"warehouse")}function roadNeighbors(grid,x,y){return neighbors(grid,x,y,"road")}function chooseRoadModel(grid,x,y){const hits=roadNeighbors(grid,x,y);if(hits.includes("S")&&hits.includes("E"))return{basePath:assetRegistry.road.cornerSE,rotationY:0,rule:"road south+east corner"};return{basePath:assetRegistry.road.basePath,rotationY:0,rule:"road default"}}
function rotationForFacing(dir){return{E:0,S:Math.PI/2,W:Math.PI,N:Math.PI*1.5}[dir]??0}function addVerticalRotation(r){return r+Math.PI}function chooseWarehouseModel(grid,x,y){const hits=countWarehouseNeighbors(grid,x,y);if(hits.length===0)return{basePath:warehouseModels.isolated,rotationY:0,rule:"isolated"};if(hits.length===1){const dir=hits[0];let rot=rotationForFacing(dir);if(dir==="N"||dir==="S")rot=addVerticalRotation(rot);return{basePath:warehouseModels.end,rotationY:rot,rule:"end cap faces "+dir+(dir==="N"||dir==="S"?" +180 vertical":"")}}if(hits.includes("E")&&hits.includes("W"))return{basePath:warehouseModels.center,rotationY:0,rule:"horizontal center"};if(hits.includes("N")&&hits.includes("S"))return{basePath:warehouseModels.center,rotationY:addVerticalRotation(Math.PI/2),rule:"vertical center +180"};return{basePath:warehouseModels.center,rotationY:0,rule:"center fallback"}}
function createTextSprite(text){const canvas=document.createElement("canvas");canvas.width=256;canvas.height=256;const ctx=canvas.getContext("2d");ctx.fillStyle="rgba(0,0,0,0.65)";ctx.beginPath();ctx.arc(128,128,92,0,Math.PI*2);ctx.fill();ctx.strokeStyle="white";ctx.lineWidth=10;ctx.stroke();ctx.fillStyle="white";ctx.font="bold 128px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,128,138);const texture=new THREE.CanvasTexture(canvas);const material=new THREE.SpriteMaterial({map:texture,depthTest:false});const sprite=new THREE.Sprite(material);sprite.scale.set(.75,.75,.75);return sprite}function addDirectionMarkers(){const g=new THREE.Group(),y=.18;for(const m of[{label:"N",pos:[4.5,y,-1.25]},{label:"S",pos:[4.5,y,10.25]},{label:"E",pos:[10.25,y,4.5]},{label:"W",pos:[-1.25,y,4.5]}]){const s=createTextSprite(m.label);s.position.set(...m.pos);g.add(s)}scene.add(g)}
function initScene(){scene=new THREE.Scene();scene.background=new THREE.Color(0x151515);camera=new THREE.PerspectiveCamera(55,1,.1,1000);camera.position.set(12,11,14);renderer=new THREE.WebGLRenderer({antialias:true});renderer.shadowMap.enabled=true;viewport.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;controls.target.set(4.5,0,4.5);controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.PAN,RIGHT:THREE.MOUSE.PAN};scene.add(new THREE.AmbientLight(0xffffff,.65));const sun=new THREE.DirectionalLight(0xffffff,1.35);sun.position.set(8,14,8);sun.castShadow=true;scene.add(sun);const grid=new THREE.GridHelper(10,10,0x777777,0x333333);grid.position.set(4.5,.006,4.5);scene.add(grid);const ground=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshStandardMaterial({color:0x222222,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.set(4.5,-.012,4.5);ground.receiveShadow=true;scene.add(ground);addDirectionMarkers();tileGroup=new THREE.Group();scene.add(tileGroup);renderer.domElement.addEventListener("pointermove",onPointerMove);renderer.domElement.addEventListener("click",onClick);renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());window.addEventListener("resize",resize);resize()}function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}function loadGLB(path){return new Promise((res,rej)=>gltfLoader.load(versioned(path),g=>res(g.scene),undefined,rej))}function loadFBX(path){return new Promise((res,rej)=>fbxLoader.load(versioned(path),o=>res(o),undefined,rej))}async function loadModelWithFallback(basePath){try{return await loadGLB(basePath+".glb")}catch(e){return await loadFBX(basePath+".fbx")}}function normalizeModelToTile(obj){const box=new THREE.Box3().setFromObject(obj),size=new THREE.Vector3();box.getSize(size);const footprint=Math.max(size.x||1,size.z||1);const s=footprint?TILE_SIZE/footprint:1;obj.scale.multiplyScalar(s);const box2=new THREE.Box3().setFromObject(obj),center=new THREE.Vector3();box2.getCenter(center);obj.position.x-=center.x;obj.position.z-=center.z;obj.position.y-=box2.min.y;obj.userData.normalizedBounds={sourceX:size.x,sourceY:size.y,sourceZ:size.z,scaleUniform:s,targetFootprint:TILE_SIZE};obj.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;if(n.material)n.material=n.material.clone()}});return obj}async function getModelPrototype(basePath){if(modelCache[basePath])return modelCache[basePath];const model=await loadModelWithFallback(basePath);normalizeModelToTile(model);modelCache[basePath]=model;return model}function tintObject(obj,hex){obj.traverse(n=>{if(n.isMesh&&n.material&&n.material.color)n.material.color.set(hex)})}function clearTiles(){while(tileGroup.children.length)tileGroup.remove(tileGroup.children[0]);pickables=[];selectedType=null;selectedTypeEl.textContent="None — click a tile/model";colorPicker.disabled=true}
async function renderRows(rows,sourceLabel){clearTiles();setStatus("Rendering "+sourceLabel+"...");const valid=rows.map((row,i)=>({x:Number(row.x),y:Number(row.y),height:Math.max(.01,Number(row.height)),label:String(row.label||`Cube ${i+1}`).trim().toLowerCase(),color:colorFor(row.label,row.color)})).filter(r=>Number.isFinite(r.x)&&Number.isFinite(r.y));const grid=buildGrid(valid);let modelCount=0,cubeCount=0,failed=[];for(const r of valid){let obj=null;let modelInfo={basePath:null,rotationY:0,rule:"cube"};if(r.label==="warehouse")modelInfo=chooseWarehouseModel(grid,r.x,r.y);else if(r.label==="road")modelInfo=chooseRoadModel(grid,r.x,r.y);else if(assetRegistry[r.label]?.useModel)modelInfo={basePath:assetRegistry[r.label].basePath,rotationY:0,rule:r.label};if(modelInfo.basePath){try{const proto=await getModelPrototype(modelInfo.basePath);obj=proto.clone(true);obj.rotation.y+=modelInfo.rotationY;tintObject(obj,colorFor(r.label,r.color));modelCount++}catch(e){failed.push(`${r.label} ${modelInfo.basePath}: ${e.message}`)}}if(!obj){const h=r.height;obj=new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE,h,TILE_SIZE),new THREE.MeshStandardMaterial({color:new THREE.Color(r.color),roughness:.58,metalness:.06}));obj.position.y=h/2;cubeCount++}obj.position.x+=r.x*TILE_SIZE;obj.position.z+=r.y*TILE_SIZE;obj.userData={...r,type:r.label,root:obj,modelBasePath:modelInfo.basePath||"cube",rule:modelInfo.rule,rotationY:modelInfo.rotationY,normalizedBounds:obj.userData.normalizedBounds||null};obj.traverse?.(n=>{n.userData={...r,type:r.label,root:obj,modelBasePath:modelInfo.basePath||"cube",rule:modelInfo.rule,rotationY:modelInfo.rotationY,normalizedBounds:obj.userData.normalizedBounds||null}});tileGroup.add(obj);pickables.push(obj)}controls.target.set(4.5,0,4.5);camera.position.set(12,11,14);controls.update();setStatus(`Rendered ${valid.length} tiles from ${sourceLabel}.\nModels: ${modelCount} | Cubes: ${cubeCount}${failed.length?"\nModel load failures:\n"+failed.join("\n"):""}`)}async function loadGoogleSheet(){try{setStatus("Loading Google Sheet CSV...");const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);const csv=await res.text();if(csv.trim().startsWith("<"))throw new Error("Google returned HTML, not CSV.");await renderRows(parseCSV(csv),"Google Sheet")}catch(e){setStatus("Google Sheet load failed. Rendering embedded backup.\n"+e.message);await renderRows(parseCSV(EMBEDDED_CSV),"embedded backup data")}}function renderEmbedded(){renderRows(parseCSV(EMBEDDED_CSV),"embedded backup data")}function getHit(event){const rect=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-rect.left)/rect.width)*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(pickables,true);return hits.length?(hits[0].object.userData.root||hits[0].object):null}function onClick(e){const hit=getHit(e);if(!hit)return;selectedType=hit.userData.type||hit.userData.label;selectedTypeEl.textContent=selectedType;colorPicker.disabled=false;colorPicker.value=colorByType[selectedType]||"#ffffff";const b=hit.userData.normalizedBounds;setStatus(`Selected type: ${selectedType}\nModel: ${hit.userData.modelBasePath||"cube"}\nRule: ${hit.userData.rule||""}\nRotationY: ${Math.round((hit.userData.rotationY||0)*180/Math.PI)}°${b?`\nSource bounds X/Y/Z: ${b.sourceX.toFixed(3)} / ${b.sourceY.toFixed(3)} / ${b.sourceZ.toFixed(3)}\nUniform scale: ${b.scaleUniform.toFixed(3)}`:""}`)}function onPointerMove(e){const hit=getHit(e),rect=renderer.domElement.getBoundingClientRect();if(hit){const d=hit.userData;tooltip.style.display="block";tooltip.style.left=`${e.clientX-rect.left+14}px`;tooltip.style.top=`${e.clientY-rect.top+14}px`;tooltip.innerHTML=`<strong>${d.label}</strong><br>x: ${d.x}, y: ${d.y}<br>model: ${d.modelBasePath||"cube"}<br>rule: ${d.rule||""}<br><em>Click to select this type</em>`}else tooltip.style.display="none"}colorPicker.addEventListener("input",e=>{if(!selectedType)return;colorByType[selectedType]=e.target.value;let count=0;for(const obj of pickables){if((obj.userData.type||obj.userData.label)===selectedType){tintObject(obj,e.target.value);if(obj.material?.color)obj.material.color.set(e.target.value);count++}}setStatus(`Changed ${count} ${selectedType} tile(s) to ${e.target.value}.`)});function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}document.querySelector("#reloadButton").addEventListener("click",loadGoogleSheet);document.querySelector("#fallbackButton").addEventListener("click",renderEmbedded);initScene();renderEmbedded();loadGoogleSheet();animate();
