<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Heavy Armor 3D Viewer</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#111;color:#f5f5f5}#appShell{display:grid;grid-template-columns:380px 1fr;height:100vh}#controls{box-sizing:border-box;padding:18px;background:#1c1c1c;border-right:1px solid #333;overflow:auto}h1{margin:0 0 8px;font-size:28px}.muted{color:#aaa;line-height:1.35}button{padding:10px 12px;border:0;border-radius:8px;color:#111;background:#f2f2f2;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}#status,#selectionPanel,.urlBox{margin-top:14px;padding:10px;background:#0e0e0e;border:1px solid #333;border-radius:8px;color:#ddd;white-space:pre-wrap;overflow-wrap:anywhere}#colorPicker{width:100%;height:42px;margin-top:8px}#viewport{position:relative;width:100%;height:100%}#tooltip{position:absolute;display:none;pointer-events:none;padding:8px 10px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.18);border-radius:8px;font-size:13px;white-space:nowrap}#versionBadge{position:absolute;top:10px;right:10px;z-index:5;padding:7px 10px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font:12px/1.2 monospace;pointer-events:none}</style></head>
<body><div id="appShell"><aside id="controls"><h1>Heavy Armor 3D Viewer</h1><p class="muted">Models render 50% grey by default. Sheet cells use <code>asset, D99, 001</code>.</p><button id="reloadButton">Reload Google Sheet</button><button id="fallbackButton">Render Embedded Data</button><div id="selectionPanel"><strong>Selected type:</strong><div id="selectedType">None — click a tile/model</div><input id="colorPicker" type="color" value="#808080" disabled /></div><div class="urlBox">Controls:<br><code>Left drag: rotate</code><br><code>Middle drag: pan</code><br><code>Mouse wheel: zoom</code><br><code>Right drag: pan</code><br><br>Asset version: <code id="assetVersionText"></code></div><div class="urlBox" id="sourceUrl"></div><div id="status">HTML loaded. Starting JavaScript...</div></aside><main id="viewport"><div id="versionBadge">version loading...</div><div id="tooltip"></div></main></div><script>window.addEventListener("error",e=>{const s=document.getElementById("status");if(s)s.textContent="Startup error:\n"+e.message+"\n"+(e.filename||"")+":"+(e.lineno||"")});window.addEventListener("unhandledrejection",e=>{const s=document.getElementById("status");if(s)s.textContent="Promise error:\n"+(e.reason?.message||String(e.reason))});</script>
<script type="module">
import * as THREE from "three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";import{GLTFLoader}from"three/addons/loaders/GLTFLoader.js";import{FBXLoader}from"three/addons/loaders/FBXLoader.js";
const ASSET_VERSION="2026-05-20-top-level-await-fix-1";const CACHE_BUST=`${ASSET_VERSION}-${Date.now()}`;const SPREADSHEET_ID="1aUA0YkAy1gIL9ifFWxjCdS6y3y3QI2izKEDKWiou-qs";const SHEET_NAME="cubeTest_converted";const CSV_URL=`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;const RULE_MANIFEST_URL="./rules/manifest.json";const TILE_SIZE=1.0;const DEFAULT_MODEL_COLOR="#808080";
const EMBEDDED_CSV=`"warehouse, D99, 001","warehouse, D99, 001","warehouse, D99, 001","road, D99, 001","parking lot, D99, 001","parking lot, D99, 001","parking lot, D99, 001","kiosk, D99, 001","parking lot, D99, 001","parking lot, D99, 001"
"parking lot, D99, 001","parking lot, D99, 001","road, D99, 001","road, D99, 001","parking lot, D99, 001","parking lot, D99, 001","parking lot, D99, 001","road, D99, 001","road, D99, 001","parking lot, D99, 001"
"parking lot, D99, 001","parking lot, D99, 001","road, D99, 001","warehouse, D99, 001","warehouse, D99, 001","road, D99, 001","parking lot, D99, 001","parking lot, D99, 001","road, D99, 001","parking lot, D99, 001"`;
let tileRules={},defaultColors={};const colorByType={};const typeColorOverrides={};const modelCache={};let scene,camera,renderer,controls,tileGroup,selectedType=null;let pickables=[];const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();const gltfLoader=new GLTFLoader(),fbxLoader=new FBXLoader();const viewport=document.querySelector("#viewport"),statusEl=document.querySelector("#status"),tooltip=document.querySelector("#tooltip"),selectedTypeEl=document.querySelector("#selectedType"),colorPicker=document.querySelector("#colorPicker"),versionBadge=document.querySelector("#versionBadge");document.querySelector("#sourceUrl").textContent=CSV_URL;document.querySelector("#assetVersionText").textContent=CACHE_BUST;versionBadge.textContent=`v ${ASSET_VERSION}`;
function versioned(p){return`${p}?v=${encodeURIComponent(CACHE_BUST)}`}function setStatus(m){statusEl.textContent=m}async function loadRuleFiles(){const manifestResponse=await fetch(versioned(RULE_MANIFEST_URL),{cache:"no-store"});if(!manifestResponse.ok)throw new Error(`Manifest load failed: ${manifestResponse.status} ${manifestResponse.statusText}`);const manifest=await manifestResponse.json();const files=Array.isArray(manifest.rules)?manifest.rules:[];const loaded={};for(const file of files){try{const r=await fetch(versioned(`./rules/${file}`),{cache:"no-store"});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);const json=await r.json();loaded[json.type]=json}catch(e){console.warn("Rule load failed",file,e)}}tileRules=loaded;return files}
function parseCSV(text){const rows=[];let cur="",row=[],q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cur+='"';i++}else if(c==='"')q=!q;else if(c===","&&!q){row.push(cur.trim());cur=""}else if((c==="\n"||c==="\r")&&!q){if(cur||row.length){row.push(cur.trim());rows.push(row);row=[];cur=""}if(c==="\r"&&n==="\n")i++}else cur+=c}if(cur||row.length)rows.push([...row,cur.trim()]);return rows.filter(r=>r.some(cell=>String(cell).trim()!==""))}
function combineLegacyTriples(row){const combined=[];for(let i=0;i<row.length;){const a=String(row[i]||"").trim(),b=String(row[i+1]||"").trim(),c=String(row[i+2]||"").trim();if(b.match(/^D\d{1,2}$/i)&&c.match(/^\d{1,3}$/)){combined.push(`${a}, ${b}, ${c}`);i+=3}else{combined.push(a);i++}}return combined}
function parseTileCell(cell,x,y){const raw=String(cell||"").trim();if(!raw)return null;const parts=raw.split(",").map(p=>p.trim()).filter(Boolean);const assetName=(parts[0]||"").toLowerCase();if(!assetName||assetName.match(/^D\d{1,2}$/i)||assetName.match(/^\d{1,3}$/))return null;const damageToken=(parts[1]||"D99").toUpperCase();const variant=(parts[2]||"001").padStart(3,"0");const damageMatch=damageToken.match(/^D(\d{1,2})$/);const damage=damageMatch?Math.max(0,Math.min(99,Number(damageMatch[1]))):99;return{x,y,height:1,label:assetName,assetName,damageToken:`D${String(damage).padStart(2,"0")}`,damage,variant,color:DEFAULT_MODEL_COLOR,rawCell:raw}}
function parseGridCSV(text){const rawRows=parseCSV(text);const out=[];for(let y=0;y<rawRows.length;y++){const row=combineLegacyTriples(rawRows[y]);for(let x=0;x<row.length;x++){const tile=parseTileCell(row[x],x,y);if(tile)out.push(tile)}}return out}
function colorFor(label,color){const key=String(label||"").trim().toLowerCase();return typeColorOverrides[key]||DEFAULT_MODEL_COLOR}function buildGrid(rows){const grid=new Map();for(const r of rows)grid.set(`${r.x},${r.y}`,r.label);return grid}function neighbors(grid,x,y,type){const dirs=[[0,-1,"N"],[1,0,"E"],[0,1,"S"],[-1,0,"W"]],hits=[];for(const[dx,dy,d]of dirs){if(grid.get(`${x+dx},${y+dy}`)===type)hits.push(d)}return hits}
function ruleMatches(rule,hits){const required=rule.requires||[];if(!required.every(d=>hits.includes(d)))return false;if(rule.requiresExactCount!==undefined&&hits.length!==rule.requiresExactCount)return false;if(rule.requiresMinimumCount!==undefined&&hits.length<rule.requiresMinimumCount)return false;return true}function applyGenericRules(ruleDef,grid,x,y,type){if(!ruleDef||!ruleDef.usesModel)return{basePath:null,rotationY:0,rule:"cube"};const hits=neighbors(grid,x,y,type);if(Array.isArray(ruleDef.rules)){const fallback=ruleDef.rules.find(r=>r.default)||null;for(const rule of ruleDef.rules){if(rule.default)continue;if(ruleMatches(rule,hits))return{basePath:ruleDef.models?.[rule.model]||null,rotationY:(rule.rotationDegrees||0)*Math.PI/180,rule:rule.name||"json rule"}}if(fallback&&ruleMatches(fallback,hits))return{basePath:ruleDef.models?.[fallback.model]||null,rotationY:(fallback.rotationDegrees||0)*Math.PI/180,rule:fallback.name||"json default"}}const modelKey=ruleDef.models?.default?"default":Object.keys(ruleDef.models||{})[0];return{basePath:ruleDef.models?.[modelKey]||null,rotationY:0,rule:"json default model"}}
function createTextSprite(text){const canvas=document.createElement("canvas");canvas.width=256;canvas.height=256;const ctx=canvas.getContext("2d");ctx.fillStyle="rgba(0,0,0,0.65)";ctx.beginPath();ctx.arc(128,128,92,0,Math.PI*2);ctx.fill();ctx.strokeStyle="white";ctx.lineWidth=10;ctx.stroke();ctx.fillStyle="white";ctx.font="bold 128px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,128,138);const texture=new THREE.CanvasTexture(canvas);const material=new THREE.SpriteMaterial({map:texture,depthTest:false});const sprite=new THREE.Sprite(material);sprite.scale.set(.75,.75,.75);return sprite}function addDirectionMarkers(){const g=new THREE.Group(),y=.18;for(const m of[{label:"N",pos:[4.5,y,-1.25]},{label:"S",pos:[4.5,y,10.25]},{label:"E",pos:[10.25,y,4.5]},{label:"W",pos:[-1.25,y,4.5]}]){const s=createTextSprite(m.label);s.position.set(...m.pos);g.add(s)}scene.add(g)}
function initScene(){scene=new THREE.Scene();scene.background=new THREE.Color(0x151515);camera=new THREE.PerspectiveCamera(55,1,.1,1000);camera.position.set(12,11,14);renderer=new THREE.WebGLRenderer({antialias:true});renderer.shadowMap.enabled=true;viewport.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;controls.target.set(4.5,0,4.5);controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.PAN,RIGHT:THREE.MOUSE.PAN};scene.add(new THREE.AmbientLight(0xffffff,.65));const sun=new THREE.DirectionalLight(0xffffff,1.35);sun.position.set(8,14,8);sun.castShadow=true;scene.add(sun);const grid=new THREE.GridHelper(10,10,0x777777,0x333333);grid.position.set(4.5,.006,4.5);scene.add(grid);const ground=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshStandardMaterial({color:0x222222,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.set(4.5,-.012,4.5);ground.receiveShadow=true;scene.add(ground);addDirectionMarkers();tileGroup=new THREE.Group();scene.add(tileGroup);renderer.domElement.addEventListener("pointermove",onPointerMove);renderer.domElement.addEventListener("click",onClick);renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());window.addEventListener("resize",resize);resize()}function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}function loadGLB(path){return new Promise((res,rej)=>gltfLoader.load(versioned(path),g=>res(g.scene),undefined,rej))}function loadFBX(path){return new Promise((res,rej)=>fbxLoader.load(versioned(path),o=>res(o),undefined,rej))}async function loadModelWithFallback(basePath){try{return await loadGLB(basePath+".glb")}catch(e){return await loadFBX(basePath+".fbx")}}
function applyGreyMaterial(obj){obj.traverse(n=>{if(!n.isMesh)return;n.castShadow=true;n.receiveShadow=true;n.material=new THREE.MeshStandardMaterial({color:new THREE.Color(DEFAULT_MODEL_COLOR),roughness:.58,metalness:.06,side:THREE.DoubleSide});}})}
function normalizeModelToTile(obj){const box=new THREE.Box3().setFromObject(obj),size=new THREE.Vector3();box.getSize(size);const footprint=Math.max(size.x||1,size.z||1);const s=footprint?TILE_SIZE/footprint:1;obj.scale.multiplyScalar(s);const box2=new THREE.Box3().setFromObject(obj),center=new THREE.Vector3();box2.getCenter(center);obj.position.x-=center.x;obj.position.z-=center.z;obj.position.y-=box2.min.y;obj.userData.normalizedBounds={sourceX:size.x,sourceY:size.y,sourceZ:size.z,scaleUniform:s,targetFootprint:TILE_SIZE};applyGreyMaterial(obj);return obj}async function getModelPrototype(basePath){if(modelCache[basePath])return modelCache[basePath];const model=await loadModelWithFallback(basePath);normalizeModelToTile(model);modelCache[basePath]=model;return model}
function tintObject(obj,hex){obj.traverse(n=>{if(n.isMesh){const mats=Array.isArray(n.material)?n.material:[n.material];for(const mat of mats){if(!mat)continue;mat.vertexColors=false;if(mat.color)mat.color.set(hex);mat.needsUpdate=true}}})}function applyTypeColorIfOverridden(obj,type){const hex=typeColorOverrides[type];if(hex)tintObject(obj,hex)}function clearTiles(){while(tileGroup.children.length)tileGroup.remove(tileGroup.children[0]);pickables=[];selectedType=null;selectedTypeEl.textContent="None — click a tile/model";colorPicker.disabled=true}
async function renderRows(rows,sourceLabel){clearTiles();setStatus("Rendering "+sourceLabel+"...");const valid=rows.filter(r=>Number.isFinite(r.x)&&Number.isFinite(r.y)&&r.label);const grid=buildGrid(valid);let modelCount=0,cubeCount=0,failed=[];for(const r of valid){let obj=null;const ruleDef=tileRules[r.label];let modelInfo=applyGenericRules(ruleDef,grid,r.x,r.y,r.label);if(modelInfo.basePath){try{const proto=await getModelPrototype(modelInfo.basePath);obj=proto.clone(true);obj.rotation.y+=modelInfo.rotationY;applyTypeColorIfOverridden(obj,r.label);modelCount++}catch(e){failed.push(`${r.label} ${modelInfo.basePath}: ${e.message}`)}}if(!obj){const h=r.height||1;obj=new THREE.Mesh(new THREE.BoxGeometry(TILE_SIZE,h,TILE_SIZE),new THREE.MeshStandardMaterial({color:new THREE.Color(colorFor(r.label,r.color)),roughness:.58,metalness:.06,side:THREE.DoubleSide}));obj.position.y=h/2;applyTypeColorIfOverridden(obj,r.label);cubeCount++}obj.position.x+=r.x*TILE_SIZE;obj.position.z+=r.y*TILE_SIZE;obj.userData={...r,type:r.label,root:obj,modelBasePath:modelInfo.basePath||"cube",rule:modelInfo.rule,rotationY:modelInfo.rotationY,normalizedBounds:obj.userData.normalizedBounds||null};obj.traverse?.(n=>{n.userData={...r,type:r.label,root:obj,modelBasePath:modelInfo.basePath||"cube",rule:modelInfo.rule,rotationY:modelInfo.rotationY,normalizedBounds:obj.userData.normalizedBounds||null}});tileGroup.add(obj);pickables.push(obj)}controls.target.set(4.5,0,4.5);camera.position.set(12,11,14);controls.update();setStatus(`Rendered ${valid.length} grid tiles from ${sourceLabel}.\nApp version: ${ASSET_VERSION}\nModels render 50% grey unless a color override is selected.\nRules loaded from manifest: ${Object.keys(tileRules).join(", ")}\nCache bust: ${CACHE_BUST}\nModels: ${modelCount} | Cubes: ${cubeCount}${failed.length?"\nModel load failures:\n"+failed.join("\n"):""}`)}async function loadGoogleSheet(){try{setStatus("Loading Google Sheet grid CSV...");const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);const csv=await res.text();if(csv.trim().startsWith("<"))throw new Error("Google returned HTML, not CSV.");await renderRows(parseGridCSV(csv),"Google Sheet grid")}catch(e){setStatus("Google Sheet load failed. Rendering embedded backup.\n"+e.message);await renderRows(parseGridCSV(EMBEDDED_CSV),"embedded backup grid")}}function renderEmbedded(){renderRows(parseGridCSV(EMBEDDED_CSV),"embedded backup grid")}function getHit(event){const rect=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-rect.left)/rect.width)*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(pickables,true);return hits.length?(hits[0].object.userData.root||hits[0].object):null}function onClick(e){const hit=getHit(e);if(!hit)return;selectedType=hit.userData.type||hit.userData.label;selectedTypeEl.textContent=selectedType;colorPicker.disabled=false;colorPicker.value=typeColorOverrides[selectedType]||DEFAULT_MODEL_COLOR;const b=hit.userData.normalizedBounds;setStatus(`Selected type: ${selectedType}\nX/Y: ${hit.userData.x}, ${hit.userData.y}\nDamage: ${hit.userData.damageToken}\nVariant: ${hit.userData.variant}\nModel: ${hit.userData.modelBasePath||"cube"}\nApp version: ${ASSET_VERSION}\nColor mode: ${typeColorOverrides[selectedType]?"picker override":"50% grey default"}\nRule: ${hit.userData.rule||""}\nRotationY: ${Math.round((hit.userData.rotationY||0)*180/Math.PI)}°\nCache bust: ${CACHE_BUST}${b?`\nSource bounds X/Y/Z: ${b.sourceX.toFixed(3)} / ${b.sourceY.toFixed(3)} / ${b.sourceZ.toFixed(3)}\nUniform scale: ${b.scaleUniform.toFixed(3)}`:""}`)}function onPointerMove(e){const hit=getHit(e),rect=renderer.domElement.getBoundingClientRect();if(hit){const d=hit.userData;tooltip.style.display="block";tooltip.style.left=`${e.clientX-rect.left+14}px`;tooltip.style.top=`${e.clientY-rect.top+14}px`;tooltip.innerHTML=`<strong>${d.label}</strong><br>x: ${d.x}, y: ${d.y}<br>damage: ${d.damageToken}<br>variant: ${d.variant}<br>model: ${d.modelBasePath||"cube"}<br>rule: ${d.rule||""}<br><em>Click to select this type</em>`}else tooltip.style.display="none"}colorPicker.addEventListener("input",e=>{if(!selectedType)return;typeColorOverrides[selectedType]=e.target.value;colorByType[selectedType]=e.target.value;let count=0;for(const obj of pickables){if((obj.userData.type||obj.userData.label)===selectedType){tintObject(obj,e.target.value);count++}}setStatus(`Changed ${count} ${selectedType} tile(s) to ${e.target.value}.\nApp version: ${ASSET_VERSION}`)});function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}async function main(){try{setStatus(`Starting app...\nApp version: ${ASSET_VERSION}`);initScene();await loadRuleFiles();renderEmbedded();await loadGoogleSheet();animate()}catch(e){setStatus(`Startup failed:\n${e.message||String(e)}\nApp version: ${ASSET_VERSION}`);console.error(e)}}document.querySelector("#reloadButton").addEventListener("click",loadGoogleSheet);document.querySelector("#fallbackButton").addEventListener("click",renderEmbedded);main();
</script></body></html>
